<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2430;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <h2 style="margin:0 0 16px;">Confirme seu e-mail</h2>
                <p style="margin:0 0 16px;line-height:1.5;">
                  Bem-vindo ao Duro.app! Clique no botão abaixo para confirmar seu e-mail e ativar sua conta.
                </p>
                <p style="margin:24px 0;">
                  <a href="{{ .ConfirmationURL }}" style="background:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:10px;display:inline-block;font-weight:bold;">
                    Confirmar e-mail
                  </a>
                </p>
                <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.5;">
                  Se o botão não funcionar, copie e cole este link no navegador:<br />
                  <a href="{{ .ConfirmationURL }}" style="color:#2563eb;word-break:break-all;">{{ .ConfirmationURL }}</a>
                </p>
                <p style="margin:24px 0 0;font-size:13px;color:#6b7280;">
                  Se você não criou uma conta, ignore este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
